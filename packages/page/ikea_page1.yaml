        id: page1
        lambda: |- 
          it.line(0,35,30,35, white);
          it.line(98,35,128,35, white);
          it.line(64,0,64,25, white);
          it.print(0, 22, id(font11), white, "IAQ");
          it.print(92, 22, id(font11), white, "PRESS");

          it.line(0,130,22,130, white);          
          it.line(102,130,128,130, white); 
          
          // Цыфровые часы
          auto now = id(sntp_time).now();    
          int sec = now.second;  
          if (sec % 2)
            it.strftime(25, 136, id(SEG24), lyellow,"%H:%M", now);
          else
            it.strftime(25, 136, id(SEG24), lyellow,"%H %M", now);

          it.print(0, 131, id(font11), lyellow, "TIME");

          // давление
          // давление — цвет по прогнозу (низкое → дождь → синий, высокое → ясно → зелёный/жёлтый)
          Color press_color = white;
          switch ((int)id(bme680_p).state) {
            case 0 ... 729:   press_color = blue;    break;  // шторм — голубой
            case 730 ... 745: press_color = lblue;   break;  // дождь — светло-синий
            case 746 ... 755: press_color = yellow;  break;  // переменно
            case 756 ... 765: press_color = green;   break;  // норма
            case 766 ... 775: press_color = lgreen;  break;  // ясно
            default:          press_color = lyellow; break;  // устойчиво ясно
          }
          it.printf(70,0, id(SEG24), press_color, "%3.0f", id(bme680_p).state);

          // IAQ
          // IAQ — цвет по значению
          Color iaq_color = white;
          switch ((int)id(bme680_iaq).state) {
            case 0 ... 50:    iaq_color = green;   break;
            case 51 ... 100:  iaq_color = lgreen;  break;
            case 101 ... 150: iaq_color = yellow;  break;
            case 151 ... 200: iaq_color = lyellow; break;
            case 201 ... 300: iaq_color = red;     break;
            default:          iaq_color = tred;    break;
          }

          if (id(bme680_iaq).state >= 1000) {
            it.printf(0, 0, id(SEG16), iaq_color, TextAlign::TOP_LEFT, "%.0f", id(bme680_iaq).state);
          } else {
            it.printf(0, 0, id(SEG24), iaq_color, "%3.0f", id(bme680_iaq).state);
          }

          // it.printf(0, 0, id(SEG24), iaq_color, "%3.0f", id(bme680_iaq).state);

          //оформление центра
          it.printf(64, 80, id(SEG24), white, TextAlign::CENTER, "%.0f", id(pm1).state);
          it.print(64, 105, id(font11), white, TextAlign::CENTER, "ppm");
          it.print(64, 130, id(font11), white, TextAlign::CENTER, "PM1");
          
          // Индикатор сонца над горизонтом
          if ((id(elevation).state) > 0) {
            id(g_sun).next_frame();
            it.image(110, 140, id(g_sun), yellow);
            }
          else {
            it.image(110, 140, id(g_moon), white);
            id(g_moon).next_frame();
            }
          // Состояние вентилятора
          if (id(vent_bin).state) {
            it.image(0, 140, id(g_fan));
            id(g_fan).next_frame();
          }

          //  Размеры
          int centerX = 64; 
          int centerY = 85; 
          int radius = 60;
          int zradius = 55;
          int vradius = 46;
          int mradius = 40;
          int width = 3;

          // Большой белый
          //PI / 180 = 0.0174533
          for (int grad = 130; grad <= 175; grad++) {
            float radian = grad * 0.0174533;
            it.draw_pixel_at(centerX+radius*cos(radian), centerY+radius*sin(radian), white);
          }
          for (int grad = 185; grad <= 260; grad++) {
            float radian = grad * 0.0174533;
            it.draw_pixel_at(centerX+radius*cos(radian), centerY+radius*sin(radian), white);
          }
          for (int grad = 280; grad <= 355; grad++) {
            float radian = grad * 0.0174533;
            it.draw_pixel_at(centerX+radius*cos(radian), centerY+radius*sin(radian), white);
          }
          for (int grad = 365; grad <= 410; grad++) {
            float radian = grad * 0.0174533;
            it.draw_pixel_at(centerX+radius*cos(radian), centerY+radius*sin(radian), white);
          }

          // Малый белый
          for (int grad = 135; grad <= 405; grad++) {
            float radian = grad * 0.0174533;
            it.draw_pixel_at(centerX+mradius*cos(radian), centerY+mradius*sin(radian), white);
          }
          for (int grad = 60; grad <= 120; grad++) {
            //PI / 180 = 0.0174533 
            float radian = grad * 0.0174533;
            it.draw_pixel_at(centerX+mradius*cos(radian), centerY+mradius*sin(radian), white);
          }

          // Синий сопровождение
          for (int grad = 135; grad <= 410; grad++) {
            float radian = grad * 0.0174533;
            it.filled_circle(centerX+vradius*cos(radian), centerY+vradius*sin(radian), width, blue);
          }  
          // Значение PM1   
          if (id(pm1).state > 0) {
            for (int grad = 135; grad <= (id(pm1).state * 0.125 + 135); grad++) {
              float radian = grad * 0.0174533;
              it.filled_circle(centerX+zradius*cos(radian), centerY+zradius*sin(radian), width, green);
            }  
          }